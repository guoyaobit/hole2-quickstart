name: Build and publish Docker image

on:
  push:
    branches: [ main ]
    tags: ["v*", "*" ]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest

      - name: Show pushed image info
        run: |
          echo "Pushed image tags: ghcr.io/${{ github.repository }}:latest"
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          # expose digest as job output for other jobs to consume
          echo "image_digest=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "image_ref=ghcr.io/${{ github.repository }}:latest" >> $GITHUB_OUTPUT
