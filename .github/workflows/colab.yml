name: Colab compatibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  colab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install notebook-side test dependencies
        run: python -m pip install matplotlib pandas ipywidgets
      - name: Run regression tests and compile notebook cells
        run: python -m unittest discover -s tests -v
      - name: Test Colab-style installation and a real PDB
        run: python scripts/colab_smoke.py
